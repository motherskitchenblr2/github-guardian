name: GitHub Guardian Daily Maintenance

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  security-events: write
  issues: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Guardian
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Guardian Maintenance Suite
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_OR_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 guardian.py run-all --limit 100

      - name: Upload Daily Maintenance Report
        uses: actions/upload-artifact@v4
        with:
          name: guardian-daily-report
          path: reports/
